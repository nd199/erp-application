spring:
  application:
    name: erp-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

app:
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}

logging:
  level:
    com.naren.erpbackend: INFO
