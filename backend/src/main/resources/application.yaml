spring:
  application:
    name: erp-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    jwt:
      secret: ${JWT_SECRET}
      access-expiration-ms: ${JWT_EXPIRATION:3600000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
      issuer: ${JWT_ISSUER:erp-backend}
  seeder:
    admin:
      username: ${ADMIN_USERNAME:superadmin}
      email: ${ADMIN_EMAIL:admin@erp.local}
      password: ${ADMIN_PASSWORD:admin123}

logging:
  level:
    com.naren.erpbackend: INFO
